; Versions 6 and 7 of the platform ship the Arduino-ESP32 2.0.17 line. Version 8 ships the 3.x core, which changes the ESP-NOW
; API, so Renovate does not offer version 8.
[platformio]
default_envs = hub

[env:hub]
; renovate: datasource=github-releases depName=platformio/platform-espressif32
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
; The OLED driver. The tag of the Arduino library is pinned, and its code is BSD 2 clause. The fonts have their own licenses, and the
; font of the hub (6x10) is the public domain fixed font of X11.
; renovate: datasource=github-tags depName=olikraus/U8g2_Arduino
lib_deps = https://github.com/olikraus/U8g2_Arduino.git#2.37.1

; Host side tests of the code that does not touch the hardware. They run with `pio test -e native` and write coverage data.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov
