; Version 6 of the platform ships Arduino-ESP32 2.0.17. Version 7 and later ship the 3.x core, which changes the ESP-NOW
; API, so Renovate holds a major update of the platform.
[platformio]
default_envs = hub

[env:hub]
; renovate: datasource=github-releases depName=platformio/platform-espressif32
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

; Host side tests of the code that does not touch the hardware. They run with `pio test -e native` and write coverage data.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
