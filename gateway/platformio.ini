; Versions 6 and 7 of the platform ship the Arduino-ESP32 2.0.17 line. Version 8 ships the 3.x core, which changes the ESP-NOW
; API, so Renovate does not offer version 8.
[platformio]
default_envs = hub

[env:hub]
; renovate: datasource=github-releases depName=platformio/platform-espressif32
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_flags =
    -Wall
    -Wextra
; The OLED driver U8g2 is pinned to a commit and updated by hand. The tags of its Arduino repository lag the library by one version,
; so the tag 2.37.1 holds the code of 2.36.19, and this commit is the code of 2.37.1 (2026-05-26). The code is BSD 2 clause. The fonts
; have their own licenses, and the font of the hub (6x10) is the public domain fixed font of X11.
; common/ is the code that the hub shares with the nodes. PlatformIO links this folder and builds it with the hub. If the checkout moves,
; clean the .pio folder, because the link stores the absolute path.
lib_deps =
    https://github.com/olikraus/U8g2_Arduino.git#b3a40de8822187c941b40cbbaaa77604a7ab90c7
    symlink://../common
; The roots that the TLS client trusts. The script makes certs/x509_crt_bundle.bin from the pinned Mozilla list (certs/README.md), and the build embeds it.
; The program will read it through the symbol _binary_certs_x509_crt_bundle_bin_start.
extra_scripts = pre:tools/build-cert-bundle.py
board_build.embed_files = certs/x509_crt_bundle.bin

; Host side tests of the code that does not touch the hardware. They run with `pio test -e native` and write coverage data.
[env:native]
platform = native
; The libraries of the hub that use the frames and the keys of common/ find it here, as the hub build does.
lib_deps =
    symlink://../common
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov
