; This folder is a library for the hub and the nodes, and it is also a project of its own so that its tests run on the host.
; They run with `pio test -e native`, write coverage data, and use OpenSSL only to compute the HMAC for the key derivation vectors.
[platformio]
default_envs = native

[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov
    -lcrypto
